name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voicedesk
          POSTGRES_PASSWORD: voicedesk
          POSTGRES_DB: voicedesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voicedesk -d voicedesk_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (PGlite, no services)
        run: npm test
      - name: Test against real Postgres, with coverage
        run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgres://voicedesk:voicedesk@localhost:5432/voicedesk_test
      - name: Check migrations are in sync with the schema
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "schema changed without a migration: run npm run db:generate"; exit 1
          fi
      - name: Build
        run: npm run build
